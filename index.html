<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forma — 3D Model Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg-canvas:#0b0e14;
    --bg-panel:#12161f;
    --bg-panel-raised:#171c27;
    --border:#232a38;
    --border-soft:#1a2029;
    --text-primary:#e7ebf1;
    --text-secondary:#7d8798;
    --text-dim:#4c5568;
    --accent:#5ecbd8;
    --accent-dim:#2c4d54;
    --accent-soft:rgba(94,203,216,0.12);
    --warn:#e8823c;
    --grid-line:#1c2330;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg-canvas);
    color:var(--text-primary);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }

  #app{
    display:grid;
    grid-template-columns: 220px 1fr 260px;
    grid-template-rows: 52px 1fr;
    height:100vh; width:100vw;
  }

  /* ===== Top bar ===== */
  #topbar{
    grid-column: 1 / 4;
    display:flex; align-items:center;
    padding:0 16px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--border);
    gap:20px;
  }
  #topbar .brand{
    font-weight:700; font-size:16px; letter-spacing:0.2px;
    display:flex; align-items:center; gap:8px;
    color:var(--text-primary);
  }
  #topbar .brand svg{ display:block; }
  #topbar .divider{ width:1px; height:22px; background:var(--border); }
  .tool-btn{
    background:transparent;
    border:1px solid transparent;
    color:var(--text-secondary);
    padding:6px 12px;
    border-radius:6px;
    font-family:inherit; font-size:13px; font-weight:500;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:background 0.12s, color 0.12s, border-color 0.12s;
  }
  .tool-btn:hover{ background:var(--bg-panel-raised); color:var(--text-primary); }
  .tool-btn.active{
    background:var(--accent-soft);
    color:var(--accent);
    border-color:var(--accent-dim);
  }
  .tool-btn kbd{
    font-family:'JetBrains Mono', monospace;
    font-size:10px; color:var(--text-dim);
    background:var(--bg-canvas);
    border:1px solid var(--border);
    border-radius:3px; padding:1px 4px;
  }
  #topbar-right{ margin-left:auto; display:flex; gap:8px; align-items:center; }
  .btn-primary{
    background:var(--accent);
    color:#08161a;
    border:none;
    padding:7px 14px;
    border-radius:6px;
    font-family:inherit; font-weight:600; font-size:13px;
    cursor:pointer;
    transition:filter 0.12s;
  }
  .btn-primary:hover{ filter:brightness(1.1); }

  /* ===== Left sidebar (add objects) ===== */
  #sidebar-left{
    background:var(--bg-panel);
    border-right:1px solid var(--border);
    overflow-y:auto;
    padding:16px 12px;
  }
  .section-label{
    font-size:11px; font-weight:600;
    color:var(--text-dim);
    letter-spacing:0.4px;
    margin:4px 4px 10px;
  }
  .primitive-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:22px;
  }
  .primitive-btn{
    background:var(--bg-panel-raised);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 6px 8px;
    color:var(--text-secondary);
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    font-size:11px; font-family:inherit;
    transition:border-color 0.12s, color 0.12s, transform 0.08s;
  }
  .primitive-btn:hover{ border-color:var(--accent-dim); color:var(--text-primary); }
  .primitive-btn:active{ transform:scale(0.96); }
  .primitive-btn svg{ opacity:0.85; }

  #outliner{ margin-top:4px; }
  .outliner-item{
    display:flex; align-items:center; gap:8px;
    padding:7px 8px;
    border-radius:6px;
    font-size:12.5px;
    color:var(--text-secondary);
    cursor:pointer;
    margin-bottom:2px;
    border:1px solid transparent;
  }
  .outliner-item:hover{ background:var(--bg-panel-raised); }
  .outliner-item.selected{
    background:var(--accent-soft);
    color:var(--accent);
    border-color:var(--accent-dim);
  }
  .outliner-item .swatch{
    width:10px; height:10px; border-radius:3px; flex-shrink:0;
    border:1px solid rgba(255,255,255,0.15);
  }
  .outliner-item .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .outliner-item .del-mini{
    opacity:0; color:var(--text-dim); font-size:14px; line-height:1;
    padding:2px 4px; border-radius:4px;
  }
  .outliner-item:hover .del-mini{ opacity:1; }
  .outliner-item .del-mini:hover{ color:var(--warn); background:rgba(232,130,60,0.12); }
  .empty-hint{
    color:var(--text-dim); font-size:12px; padding:8px 4px; line-height:1.6;
  }

  /* ===== Viewport ===== */
  #viewport{ position:relative; background:var(--bg-canvas); overflow:hidden; }
  #viewport canvas{ display:block; }
  #viewport-hint{
    position:absolute; bottom:14px; left:16px;
    font-size:11px; color:var(--text-dim);
    display:flex; gap:14px;
    pointer-events:none;
  }
  #axis-label{
    position:absolute; top:14px; left:16px;
    font-size:11px; color:var(--text-dim);
    font-family:'JetBrains Mono', monospace;
  }

  /* ===== Right panel (properties) ===== */
  #sidebar-right{
    background:var(--bg-panel);
    border-left:1px solid var(--border);
    overflow-y:auto;
    padding:16px 14px;
  }
  .prop-group{ margin-bottom:20px; }
  .prop-group-title{
    font-size:11px; font-weight:600; color:var(--text-dim);
    letter-spacing:0.4px; margin-bottom:10px;
  }
  .field-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .field-row label{
    width:16px; font-size:11px; color:var(--text-secondary);
    font-family:'JetBrains Mono', monospace;
  }
  .field-row input[type=number]{
    flex:1; min-width:0;
    background:var(--bg-panel-raised);
    border:1px solid var(--border);
    color:var(--text-primary);
    border-radius:5px;
    padding:6px 8px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    width:100%;
  }
  .field-row input[type=number]:focus{ outline:none; border-color:var(--accent-dim); }
  .name-input{
    width:100%;
    background:var(--bg-panel-raised);
    border:1px solid var(--border);
    color:var(--text-primary);
    border-radius:6px;
    padding:8px 10px;
    font-family:inherit; font-size:13px; font-weight:500;
    margin-bottom:16px;
  }
  .name-input:focus{ outline:none; border-color:var(--accent-dim); }
  .color-row{ display:flex; align-items:center; gap:10px; }
  .color-row input[type=color]{
    width:36px; height:36px; border:1px solid var(--border);
    border-radius:8px; background:none; cursor:pointer; padding:2px;
  }
  .color-row span{ font-size:12px; color:var(--text-secondary); font-family:'JetBrains Mono', monospace; }
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 0;
    font-size:12.5px; color:var(--text-secondary);
  }
  .switch{ position:relative; width:34px; height:19px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider-track{
    position:absolute; inset:0; background:var(--bg-panel-raised);
    border:1px solid var(--border); border-radius:20px; cursor:pointer;
    transition:background 0.15s;
  }
  .slider-track:before{
    content:""; position:absolute; width:13px; height:13px; left:2px; top:2px;
    background:var(--text-dim); border-radius:50%; transition:transform 0.15s, background 0.15s;
  }
  input:checked + .slider-track{ background:var(--accent-soft); border-color:var(--accent-dim); }
  input:checked + .slider-track:before{ transform:translateX(15px); background:var(--accent); }
  .btn-row{ display:flex; gap:8px; margin-top:4px; }
  .btn-secondary{
    flex:1;
    background:var(--bg-panel-raised);
    border:1px solid var(--border);
    color:var(--text-secondary);
    padding:8px; border-radius:6px;
    font-family:inherit; font-size:12.5px; font-weight:500;
    cursor:pointer;
  }
  .btn-secondary:hover{ color:var(--text-primary); border-color:var(--text-dim); }
  .btn-danger:hover{ color:var(--warn); border-color:var(--warn); }
  #no-selection{
    color:var(--text-dim); font-size:12.5px; line-height:1.7;
    padding:20px 4px; text-align:center;
  }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 1L18 5.5V14.5L10 19L2 14.5V5.5L10 1Z" stroke="#5ecbd8" stroke-width="1.3"/><path d="M10 1V19M2 5.5L10 10M18 5.5L10 10" stroke="#5ecbd8" stroke-width="1" opacity="0.5"/></svg>
      Forma
    </div>
    <div class="divider"></div>
    <button class="tool-btn active" data-tool="translate" id="btn-translate">Move <kbd>W</kbd></button>
    <button class="tool-btn" data-tool="rotate" id="btn-rotate">Rotate <kbd>E</kbd></button>
    <button class="tool-btn" data-tool="scale" id="btn-scale">Scale <kbd>R</kbd></button>
    <div class="divider"></div>
    <button class="tool-btn" id="btn-duplicate">Duplicate <kbd>⌘D</kbd></button>
    <button class="tool-btn" id="btn-delete">Delete <kbd>⌫</kbd></button>
    <div id="topbar-right">
      <button class="tool-btn" id="btn-clear">Clear scene</button>
      <button class="btn-primary" id="btn-export">Export .glb</button>
    </div>
  </div>

  <div id="sidebar-left">
    <div class="section-label">ADD OBJECT</div>
    <div class="primitive-grid" id="primitive-grid"></div>
    <div class="section-label">SCENE OUTLINER</div>
    <div id="outliner"></div>
  </div>

  <div id="viewport">
    <div id="axis-label">PERSPECTIVE</div>
    <div id="viewport-hint">
      <span>Left-drag: orbit</span>
      <span>Right-drag: pan</span>
      <span>Scroll: zoom</span>
      <span>Click: select</span>
    </div>
  </div>

  <div id="sidebar-right">
    <div id="panel-content">
      <div id="no-selection">Select or add an object<br>to edit its properties.</div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// ---------- Scene setup ----------
const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 18, 42);

const camera = new THREE.PerspectiveCamera(50, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
camera.position.set(5, 4, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
viewport.appendChild(renderer.domElement);

// Lights
const hemi = new THREE.HemisphereLight(0x9fd8e0, 0x0b0e14, 0.55);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(6, 10, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -12; key.shadow.camera.right = 12;
key.shadow.camera.top = 12; key.shadow.camera.bottom = -12;
scene.add(key);
const rim = new THREE.DirectionalLight(0x5ecbd8, 0.3);
rim.position.set(-6, 3, -6);
scene.add(rim);

// Grid + ground
const grid = new THREE.GridHelper(30, 30, 0x2c4d54, 0x1c2330);
grid.position.y = 0;
scene.add(grid);

const groundGeo = new THREE.PlaneGeometry(60, 60);
const groundMat = new THREE.ShadowMaterial({ opacity: 0.28 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Controls
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.08;
orbit.target.set(0, 0.6, 0);

const transformControls = new TransformControls(camera, renderer.domElement);
transformControls.addEventListener('dragging-changed', (e) => { orbit.enabled = !e.value; });
transformControls.addEventListener('objectChange', () => { if (selected) updatePanelFields(); });
scene.add(transformControls);

// ---------- Object management ----------
let objects = [];
let selected = null;
let idCounter = 1;

const PRIMITIVES = [
  { key: 'cube', label: 'Cube', build: () => new THREE.BoxGeometry(1, 1, 1) },
  { key: 'sphere', label: 'Sphere', build: () => new THREE.SphereGeometry(0.65, 32, 24) },
  { key: 'cylinder', label: 'Cylinder', build: () => new THREE.CylinderGeometry(0.6, 0.6, 1.2, 32) },
  { key: 'cone', label: 'Cone', build: () => new THREE.ConeGeometry(0.65, 1.2, 32) },
  { key: 'torus', label: 'Torus', build: () => new THREE.TorusGeometry(0.55, 0.2, 20, 40) },
  { key: 'plane', label: 'Plane', build: () => new THREE.PlaneGeometry(1.4, 1.4, 1, 1) },
];

const ICONS = {
  cube: `<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M13 3L22 8V18L13 23L4 18V8L13 3Z" stroke="currentColor" stroke-width="1.3"/><path d="M13 3V13M4 8L13 13M22 8L13 13" stroke="currentColor" stroke-width="1" opacity="0.55"/></svg>`,
  sphere: `<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="9" stroke="currentColor" stroke-width="1.3"/><ellipse cx="13" cy="13" rx="9" ry="3.2" stroke="currentColor" stroke-width="1" opacity="0.55"/></svg>`,
  cylinder: `<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><ellipse cx="13" cy="6.5" rx="7" ry="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 6.5V19.5C6 20.88 9.13 22 13 22C16.87 22 20 20.88 20 19.5V6.5" stroke="currentColor" stroke-width="1.3"/></svg>`,
  cone: `<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><ellipse cx="13" cy="19.5" rx="7" ry="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M13 3L6 19.5M13 3L20 19.5" stroke="currentColor" stroke-width="1.3"/></svg>`,
  torus: `<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><ellipse cx="13" cy="13" rx="10" ry="5.5" stroke="currentColor" stroke-width="1.3"/><ellipse cx="13" cy="13" rx="4.5" ry="2.2" stroke="currentColor" stroke-width="1.3"/></svg>`,
  plane: `<svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M4 9L16 4L22 9L10 14L4 9Z" stroke="currentColor" stroke-width="1.3"/></svg>`,
};

const PALETTE = [0x5ecbd8, 0xe8823c, 0x8f7ee8, 0x6bd68f, 0xe85c7a, 0xe8d15c];

function makeMaterial(colorHex) {
  return new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.45, metalness: 0.12, side: THREE.DoubleSide });
}

function addPrimitive(key) {
  const def = PRIMITIVES.find(p => p.key === key);
  if (!def) return;
  const geo = def.build();
  const color = PALETTE[idCounter % PALETTE.length];
  const mat = makeMaterial(color);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.position.set((Math.random() - 0.5) * 2, def.key === 'plane' ? 0.01 : 0.6, (Math.random() - 0.5) * 2);
  if (def.key === 'plane') mesh.rotation.x = -Math.PI / 2;
  mesh.userData.name = `${def.label} ${idCounter}`;
  mesh.userData.uid = idCounter++;
  scene.add(mesh);
  objects.push(mesh);
  selectObject(mesh);
  renderOutliner();
}

function deleteObject(obj) {
  if (!obj) return;
  if (selected === obj) selectObject(null);
  scene.remove(obj);
  obj.geometry.dispose();
  obj.material.dispose();
  objects = objects.filter(o => o !== obj);
  renderOutliner();
}

function duplicateObject(obj) {
  if (!obj) return;
  const clone = obj.clone();
  clone.material = obj.material.clone();
  clone.position.x += 0.6;
  clone.position.z += 0.6;
  clone.userData.name = obj.userData.name + ' copy';
  clone.userData.uid = idCounter++;
  scene.add(clone);
  objects.push(clone);
  selectObject(clone);
  renderOutliner();
}

function selectObject(obj) {
  selected = obj;
  if (obj) {
    transformControls.attach(obj);
  } else {
    transformControls.detach();
  }
  renderOutliner();
  renderPanel();
}

// ---------- Raycasting for click-select ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (transformControls.dragging) return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(objects, false);
  if (hits.length > 0) {
    selectObject(hits[0].object);
  } else if (e.target === renderer.domElement) {
    // clicked empty space
  }
});

// ---------- Left sidebar: primitive buttons ----------
const grid_el = document.getElementById('primitive-grid');
PRIMITIVES.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'primitive-btn';
  btn.innerHTML = `${ICONS[p.key]}<span>${p.label}</span>`;
  btn.addEventListener('click', () => addPrimitive(p.key));
  grid_el.appendChild(btn);
});

// ---------- Outliner ----------
function renderOutliner() {
  const container = document.getElementById('outliner');
  container.innerHTML = '';
  if (objects.length === 0) {
    container.innerHTML = '<div class="empty-hint">No objects yet — add a shape above to get started.</div>';
    return;
  }
  objects.forEach(obj => {
    const row = document.createElement('div');
    row.className = 'outliner-item' + (obj === selected ? ' selected' : '');
    const swatch = document.createElement('div');
    swatch.className = 'swatch';
    swatch.style.background = '#' + obj.material.color.getHexString();
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = obj.userData.name;
    const del = document.createElement('div');
    del.className = 'del-mini';
    del.textContent = '✕';
    del.addEventListener('click', (ev) => { ev.stopPropagation(); deleteObject(obj); });
    row.appendChild(swatch);
    row.appendChild(name);
    row.appendChild(del);
    row.addEventListener('click', () => selectObject(obj));
    container.appendChild(row);
  });
}

// ---------- Right panel: properties ----------
function renderPanel() {
  const panel = document.getElementById('panel-content');
  if (!selected) {
    panel.innerHTML = '<div id="no-selection">Select or add an object<br>to edit its properties.</div>';
    return;
  }
  const obj = selected;
  panel.innerHTML = `
    <input class="name-input" id="prop-name" value="${obj.userData.name}" />

    <div class="prop-group">
      <div class="prop-group-title">POSITION</div>
      <div class="field-row"><label>X</label><input type="number" step="0.1" id="pos-x"></div>
      <div class="field-row"><label>Y</label><input type="number" step="0.1" id="pos-y"></div>
      <div class="field-row"><label>Z</label><input type="number" step="0.1" id="pos-z"></div>
    </div>

    <div class="prop-group">
      <div class="prop-group-title">ROTATION (°)</div>
      <div class="field-row"><label>X</label><input type="number" step="1" id="rot-x"></div>
      <div class="field-row"><label>Y</label><input type="number" step="1" id="rot-y"></div>
      <div class="field-row"><label>Z</label><input type="number" step="1" id="rot-z"></div>
    </div>

    <div class="prop-group">
      <div class="prop-group-title">SCALE</div>
      <div class="field-row"><label>X</label><input type="number" step="0.1" id="scl-x"></div>
      <div class="field-row"><label>Y</label><input type="number" step="0.1" id="scl-y"></div>
      <div class="field-row"><label>Z</label><input type="number" step="0.1" id="scl-z"></div>
    </div>

    <div class="prop-group">
      <div class="prop-group-title">MATERIAL</div>
      <div class="color-row">
        <input type="color" id="prop-color" value="#${obj.material.color.getHexString()}">
        <span id="color-hex">#${obj.material.color.getHexString()}</span>
      </div>
      <div class="toggle-row">
        <span>Wireframe</span>
        <label class="switch">
          <input type="checkbox" id="prop-wireframe" ${obj.material.wireframe ? 'checked' : ''}>
          <span class="slider-track"></span>
        </label>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" id="panel-duplicate">Duplicate</button>
      <button class="btn-secondary btn-danger" id="panel-delete">Delete</button>
    </div>
  `;
  updatePanelFields();
  bindPanelEvents();
}

function updatePanelFields() {
  if (!selected) return;
  const obj = selected;
  const setVal = (id, v) => { const el = document.getElementById(id); if (el && document.activeElement !== el) el.value = Number(v.toFixed(3)); };
  setVal('pos-x', obj.position.x); setVal('pos-y', obj.position.y); setVal('pos-z', obj.position.z);
  setVal('rot-x', THREE.MathUtils.radToDeg(obj.rotation.x));
  setVal('rot-y', THREE.MathUtils.radToDeg(obj.rotation.y));
  setVal('rot-z', THREE.MathUtils.radToDeg(obj.rotation.z));
  setVal('scl-x', obj.scale.x); setVal('scl-y', obj.scale.y); setVal('scl-z', obj.scale.z);
}

function bindPanelEvents() {
  const obj = selected;
  document.getElementById('prop-name').addEventListener('input', (e) => {
    obj.userData.name = e.target.value;
    renderOutliner();
  });

  const bindNum = (id, apply) => {
    document.getElementById(id).addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v)) apply(v);
    });
  };
  bindNum('pos-x', v => obj.position.x = v);
  bindNum('pos-y', v => obj.position.y = v);
  bindNum('pos-z', v => obj.position.z = v);
  bindNum('rot-x', v => obj.rotation.x = THREE.MathUtils.degToRad(v));
  bindNum('rot-y', v => obj.rotation.y = THREE.MathUtils.degToRad(v));
  bindNum('rot-z', v => obj.rotation.z = THREE.MathUtils.degToRad(v));
  bindNum('scl-x', v => obj.scale.x = v);
  bindNum('scl-y', v => obj.scale.y = v);
  bindNum('scl-z', v => obj.scale.z = v);

  document.getElementById('prop-color').addEventListener('input', (e) => {
    obj.material.color.set(e.target.value);
    document.getElementById('color-hex').textContent = e.target.value;
    renderOutliner();
  });
  document.getElementById('prop-wireframe').addEventListener('change', (e) => {
    obj.material.wireframe = e.target.checked;
  });
  document.getElementById('panel-duplicate').addEventListener('click', () => duplicateObject(obj));
  document.getElementById('panel-delete').addEventListener('click', () => deleteObject(obj));
}

// ---------- Toolbar: transform modes ----------
function setTool(mode) {
  transformControls.setMode(mode);
  ['translate', 'rotate', 'scale'].forEach(m => {
    document.getElementById('btn-' + m).classList.toggle('active', m === mode);
  });
}
document.getElementById('btn-translate').addEventListener('click', () => setTool('translate'));
document.getElementById('btn-rotate').addEventListener('click', () => setTool('rotate'));
document.getElementById('btn-scale').addEventListener('click', () => setTool('scale'));
document.getElementById('btn-duplicate').addEventListener('click', () => duplicateObject(selected));
document.getElementById('btn-delete').addEventListener('click', () => deleteObject(selected));
document.getElementById('btn-clear').addEventListener('click', () => {
  [...objects].forEach(deleteObject);
});
document.getElementById('btn-export').addEventListener('click', () => {
  const exporter = new GLTFExporter();
  exporter.parse(scene.children.filter(c => objects.includes(c)).length ? { children: objects } : scene, (result) => {
    // Export just the added objects wrapped in a group for a clean file
    const exportGroup = new THREE.Group();
    const clones = objects.map(o => o.clone());
    clones.forEach(c => exportGroup.add(c));
    const exp2 = new GLTFExporter();
    exp2.parse(exportGroup, (res2) => {
      const blob = new Blob([res2], { type: 'model/gltf-binary' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'forma-scene.glb';
      a.click();
      URL.revokeObjectURL(url);
    }, (err) => console.error(err), { binary: true });
  }, (err) => console.error(err), { binary: true });
});

// ---------- Keyboard shortcuts ----------
window.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'w' || e.key === 'W') setTool('translate');
  if (e.key === 'e' || e.key === 'E') setTool('rotate');
  if (e.key === 'r' || e.key === 'R') setTool('scale');
  if (e.key === 'Backspace' || e.key === 'Delete') { if (selected) deleteObject(selected); }
  if ((e.metaKey || e.ctrlKey) && (e.key === 'd' || e.key === 'D')) { e.preventDefault(); if (selected) duplicateObject(selected); }
});

// ---------- Resize ----------
function onResize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// ---------- Animation loop ----------
function animate() {
  requestAnimationFrame(animate);
  orbit.update();
  renderer.render(scene, camera);
}
animate();

// ---------- Seed scene with a starter object ----------
addPrimitive('cube');
addPrimitive('sphere');
document.querySelector('.outliner-item')?.click();
selectObject(objects[0]);
</script>
</body>
